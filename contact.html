<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | ธนวัฒน์ จงสูงเนิน</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">🎄 TANAWAT <span>MY PAGE</span></a><nav class="navlinks"><a href="index.html">หน้าหลัก</a><a href="index.html#profile">ประวัติส่วนตัว</a><a href="contact.html">ติดต่อ</a></nav></div></header>
<main class="wrap"><div class="hero"><div class="eyebrow">✦ GET IN TOUCH ✦</div><h1>Contact Me</h1><p>กรอกแบบฟอร์มด้านล่างเพื่อส่งข้อความถึงผม</p></div>
<section class="panel"><h2 class="section-title">แบบฟอร์มการติดต่อ</h2><form id="contactForm"><div class="form-grid"><div class="field"><label for="name">ชื่อผู้ติดต่อ</label><input id="name" name="name" type="text" placeholder="กรอกชื่อของคุณ" required></div><div class="field"><label for="email">อีเมล</label><input id="email" name="email" type="email" placeholder="name@example.com" required></div><div class="field full"><label for="subject">หัวข้อ</label><input id="subject" name="subject" type="text" placeholder="ระบุหัวข้อที่ต้องการติดต่อ" required></div><div class="field full"><label for="message">ข้อความ</label><textarea id="message" name="message" placeholder="พิมพ์ข้อความของคุณ..." required></textarea></div></div><div class="actions"><button class="btn" type="submit">ส่งข้อความ</button><a class="btn secondary" href="index.html">กลับหน้าหลัก</a></div><p class="note">หมายเหตุ: ฟอร์มนี้เป็นตัวอย่าง Frontend ยังไม่ได้เชื่อมต่อระบบรับข้อความหรือฐานข้อมูล</p></form></section></main>
<footer>🎄 Merry Christmas · ธนวัฒน์ จงสูงเนิน 🎄</footer>
<script>document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();alert('ส่งตัวอย่างแบบฟอร์มเรียบร้อย! หากต้องการรับข้อความจริง ต้องเชื่อมต่อ Backend หรือบริการ Form เพิ่มเติม');this.reset();});</script></body></html>
